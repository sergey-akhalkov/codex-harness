# Deterministic Windows native checks for this commit only. This workflow is
# the synthetic CI signal: it never touches the owner's installation, never
# uses credentials, and never runs model-backed evaluation. Real installed
# launcher/install/update/recover/transport/MCP acceptance is a separate,
# explicitly selected route and is not implied by a green run here.
name: windows-native-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic checks (fmt, clippy, tests, ownership, source)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out the exact commit
        # actions/checkout v7.0.1, pinned to its immutable commit revision.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Install the pinned board tool (checksum-verified public release)
        run: |
          $archive = "$env:RUNNER_TEMP\beads_1.3.0_windows_amd64.zip"
          Invoke-WebRequest -Uri "https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_windows_amd64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "fa4c72c5d27f68f906e89a759656b5a051b330088c4acc38fa445cbb561e5cdf") {
            throw "board archive identity mismatch: $actual"
          }
          $dir = "$env:RUNNER_TEMP\bd-bin"
          Expand-Archive -Path $archive -DestinationPath $dir
          $exe = Get-ChildItem -Path $dir -Recurse -Filter bd.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "bd.exe was not in the pinned archive" }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne "9632ef4ea0941a247fcb3178a604404fd434d686e79e50805c6345b35ba9b8f1") {
            throw "board executable identity mismatch"
          }
          (Split-Path $exe) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Use a long-form temporary directory
        run: |
          New-Item -ItemType Directory -Force -Path C:\harness-tmp | Out-Null
          "TMP=C:\harness-tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=C:\harness-tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the Rust process fixture
        run: cargo build --locked -p codex-harness --bin harness-process-fixture --jobs 1

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked --jobs 1 -- -D warnings

      - name: Tests, every crate and the codex-harness unit surface
        run: cargo test --workspace --exclude codex-harness --locked --jobs 1 --no-fail-fast -- --test-threads=1

      - name: Tests, codex-harness library and binaries
        run: cargo test -p codex-harness --lib --bins --locked --jobs 1 --no-fail-fast -- --test-threads=1

      # codex-harness integration targets exercise the managed executor host,
      # the installed lifecycle and real transport surfaces. They run in the
      # separately dispatched windows-installed-integration workflow, which
      # builds the workspace and provides the pinned upstream Codex CLI; this
      # synthetic job must not report their scope as covered.

      - name: Executable ownership boundary
        run: cargo run -p codex-harness --locked --bin codex-harness -- ownership-check --source .

      - name: Source and link hygiene
        run: cargo run -p codex-harness --locked --bin harness-source-check -- --root .
