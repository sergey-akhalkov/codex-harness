[package]
name = "codex-harness"
default-run = "codex-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
harness-core = { path = "../harness-core" }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
# The native warning relay is the one place this crate speaks raw WebSocket
# frames: it must forward app-server bytes unchanged and append one notification
# shape, which the JSON-only control connection cannot express. Same pinned
# stack the control transport uses.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
skill-evolution = { path = "../skill-evolution" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regex = "=1.12.4"
toml = { version = "=0.9.11", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
skill-evolution = { path = "../skill-evolution" }
yaml-rust2 = "0.13.0"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging"] }
