[package]
name = "codex-harness"
default-run = "codex-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
harness-core = { path = "../harness-core" }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regex = "=1.12.4"
toml = { version = "=0.9.11", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_Globalization"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"] }
