[package]
name = "harness-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml = { version = "=0.9.11", default-features = false, features = ["std", "serde", "parse", "display"] }
base64 = "=0.22.1"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_System_TaskScheduler", "Win32_Security"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging"] }
