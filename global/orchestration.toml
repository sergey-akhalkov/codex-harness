# Kit-owned role routing. Native `codex --profile <id>` names must exist on the
# target installation; missing names and out-of-range limits are errors.
# `default` is the native session without an explicit profile flag, running the
# shared GPT-6 Astra default at `xhigh`; `ds` is the local DeepSeek V4.1 Flash
# profile at `max`. No xAI/Z.AI fallback is used.
schema = 1
# Root Director route and its quota-failure successor.
lead_profile = "default"
successor_lead_profile = "default"
# Leads dispatched by the Director use this route.
delegated_lead_profile = "ds"
executor_profiles = ["ds"]
# Direct-child limits for each immediate parent. Startup reservations, active
# runs and reply-waiting runs count; reconciliation gates release.
director_max_leads = 2
director_max_executors = 4
lead_max_executors = 6
# Installation-wide active Executor runs across all parents and repositories.
# Held ordinary, experiment, review and executor tasks consume the independent
# managed pool capacity below; Leads use that pool but not this Executor count.
max_concurrent_executors = 16
# Enable accepted-work self-reflection automatically for current or new sessions.
# No separate project enable command is needed. Set to false to prevent new
# executor and lead reflection model calls while ordinary work stays available;
# retained results and pending stages are preserved; finished sessions stay dormant.
self_reflection_enabled = true
# Managed worktree capacity, separate from active executor admission. Positions
# are created lazily and reused; a full pool refuses overflow. The shipped
# 2-Lead, 16-Executor topology needs eighteen positions in one repository.
worktree_pool_size = 18
# Promote an incubator item after more than two distinct votes (threshold 3).
vote_threshold = 3
incubator_size_cap = 32
feedback_batch_limit = 8
# Compatibility-only warning limit. It does not size the managed pool;
# worktree_pool_size enforces the hard capacity.
worktree_limit = 6
