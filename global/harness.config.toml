# Portable defaults, read live by the launcher through native CLI overrides.
# Native TUI settings and project trust persist in the machine-local config.toml.
# Credentials, histories, caches and installer state remain outside this repository.
approval_policy = "never"
sandbox_mode = "danger-full-access"
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
approvals_reviewer = "user"
developer_instructions = """
Use Code Mode for worthwhile independent tool batches and return decision-relevant
results with errors and detail access intact. Prefer apply_patch for suitable scoped
text edits; reuse unchanged inspected context and applicable checks. The installed
token-efficient-workflow skill covers RTK raw recovery and native task-effort
selection when verbose output or repeated work is material. Keep its detail on demand.
Main sessions run GPT-6 Astra at xhigh through ordinary Codex, and kit executor
dispatch runs DeepSeek V4.1 Flash at max through the `ds` profile. Do not route
work to xAI or Z.AI models and do not fall back to them when a route is slow,
failing or out of quota. For every OpenAI model assignment use the Astra family
only, including reserves and auxiliary calls. Do not select GPT-5 models.
Avoid repeated probes while the same failure persists. Preserve partial work.
Never silently substitute models or billing.
Do not decode opaque reasoning/compaction state to judge work: use visible messages,
tool results, artifacts and checks. Its presence alone is not an access failure.
State material input boundaries upfront. Work in the conversation's visible
surface and preserve in-flight work if its required view closes.
Do not resize, move or arrange desktop windows, including this terminal, to
make sessions fit the screen.
Do not screenshot Codex or other agent windows, send those images to a model,
or poll window pixels for status. Identify non-Codex windows with list, title,
bounds and state; reserve desktop screenshots for a genuine visual question
about owned UI.
Do not create recursive delegation trees or mandatory task paperwork. Ignore unrelated
automatic diagnostics when they do not affect the assignment. Judge efficiency by
total accepted-result cost/time including coordination, all children and rework;
never equate token counts or delegation counts with exact weekly quota savings.
"""

[agents]
# Native in-session children only; harness executors use orchestration.toml.
max_concurrent_threads_per_session = 2

[features]
apps = false
# The native worktree tools would compete with the shared harness pool.
worktrees = false

[features.context_management]
experimental_mode = true

[notice]
hide_rate_limit_model_nudge = true

[tui]
pet = "disabled"
status_line = ["model-with-reasoning", "weekly-limit", "thread-title"]
status_line_use_colors = true
